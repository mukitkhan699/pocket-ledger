org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.enableAapt2=true
aapt2.path=/usr/lib/android-sdk/build-tools/34.0.0/aapt2
# ARM64 Linux hosts must build/use an aarch64 aapt2. Pass on the command line:
#   ./gradlew assembleDebug -Pandroid.aapt2FromMavenOverride=/path/to/aapt2
# x86_64 hosts can omit the override.
